<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Thiết lập trận bot · Bang Bang</title>
  <link rel="stylesheet" href="/flash-ui.css?v=flash-native-2">
  <style>
    .bots-wrap{max-width:780px;margin:20px auto 32px;padding:0 16px}
    .bots-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .bots-logo{width:170px}
    .bots-nav{display:flex;gap:8px;flex-wrap:wrap}
    .bots-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--bb-line);font-weight:700;color:var(--bb-gold-soft)}
    .bots-row select{min-width:260px;max-width:100%}
    #testDesert{margin:12px 0 0;padding:8px 12px;border-radius:6px;background:rgba(4,41,68,.7);color:var(--bb-gold-soft);font-size:12.5px}
    .teams{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:14px 0;padding:12px 0;border-bottom:1px solid var(--bb-line)}
    .team h2{margin:0 0 10px;font-size:15px;color:var(--bb-gold)}
    .team.enemy h2{color:#ffcab8}
    .team label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:13px;color:var(--bb-ice)}
    .team select{min-width:86px}
    .human{font-size:12px;color:var(--bb-muted);margin-bottom:8px}
    .hint-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;color:var(--bb-gold-soft);font-weight:700;cursor:pointer}
    #pool{margin:8px 0 0;color:var(--bb-muted);font-size:12px}
    .bots-actions{display:flex;justify-content:center;margin-top:16px}
    .save{width:172px}
    #status{margin:12px 0 0;text-align:center}
    @media(max-width:660px){
      .bots-header{flex-direction:column}
      .bots-row{flex-direction:column;align-items:stretch}
      .bots-row select{width:100%;min-width:0}
      .teams{grid-template-columns:1fr;gap:14px}
    }
  </style>
</head>
<body class="flash-page">
  <main class="bots-wrap">
    <div class="bots-header">
      <img class="flash-logo bots-logo" src="/rez/zh_CN/gui_summer/controls/login/90fc008dc8684aadd6f2736ca5d650e8.png" alt="BANG BANG">
      <nav class="bots-nav" aria-label="Điều hướng">
        <a class="flash-btn is-quiet" href="/">← Client Flash</a>
        <a class="flash-btn is-green" href="/html5/">Bản HTML5 ↗</a>
      </nav>
    </div>

    <section class="flash-window">
      <h1 class="flash-window-head">THIẾT LẬP TRẬN BOT</h1>
      <form id="setup" class="flash-window-body">
        <label class="bots-row">
          <span>Chế độ</span>
          <select class="flash-select" id="mode">
            <option value="escort_bomb">Hộ tống xe bom — về đích / 15 phút</option>
            <option value="death_city">Sinh Tử · Thành Tận Thế — thắng 2 vòng / 150 giây</option>
            <option value="death_mine">Sinh Tử · Mỏ Khoáng Sụp Đổ — thắng 2 vòng / 150 giây</option>
            <option value="base_polar">Phá nhà · Địa Cực Dota — 15 phút</option>
            <option value="base_ruins">Phá nhà · Di Tích Maya — 15 phút</option>
            <option value="base_mineral">Phá nhà · Tranh Đoạt Tinh Khoáng — 15 phút</option>
            <option value="base_town">Phá nhà · Thị Trấn Ánh Dương — 15 phút</option>
            <option value="pk_robo">PK · Robo — 25 điểm / 4 phút</option>
            <option value="pk_cow">PK · Dắt bò — 25 điểm / 4 phút</option>
            <option value="pk_totem">PK · Vật Tổ — 25 điểm / 3 phút 30 giây</option>
            <option value="pk_maya">PK · Lời Tiên Tri Maya — 25 điểm / 4 phút</option>
            <option value="pk_mine">PK · Khu Mỏ Phóng Xạ — 25 điểm / 4 phút</option>
            <option value="pk_fortress">PK · Pháo Đài Không Gian — 25 điểm / 4 phút</option>
            <option value="pk_polar">PK · Tiền Đồn Cực Địa — 25 điểm / 3 phút 30 giây</option>
            <option value="pk_lightning">PK · Điện Chớp Sấm Rền — 25 điểm / 4 phút</option>
            <option value="pk_fastfood">PK · Quán Ăn Vui Vẻ — 25 điểm / 4 phút</option>
            <option value="pk_snow">PK · Băng Thiên Tuyết Địa — 25 điểm / 4 phút</option>
            <option value="occupy_desert">Chiếm cờ · Việt Dã — 1.000 điểm / 10 phút</option>
            <option value="occupy_tomb">Chiếm cờ · Cổ Mộ — 3 cờ / 1.000 điểm / 10 phút</option>
            <option value="occupy_freight">Chiếm cờ · Trung Tâm Vận Chuyển — 3 cờ / 1.000 điểm / 10 phút</option>
            <option value="occupy_military">Chiếm cờ · Quân Khu Tử Thần — 1.000 điểm / 10 phút</option>
            <option value="occupy_quicksand">Chiếm cờ · Vùng Cát Lún — 3 cờ / 1.000 điểm / 10 phút</option>
            <option value="test_desert">Phòng test tank — Việt Dã</option>
            <option value="test">Phòng thử tank cũ</option>
          </select>
        </label>

        <p id="testDesert" hidden>5 bot địch cấp 6 đứng yên tại chỗ (Gundam, Panda, Hulk, Songoku, Naruto), hồi sinh sau 5 giây.</p>

        <div class="teams" id="teams">
          <section class="team ally">
            <h2>Đội của bạn</h2>
            <div class="human">Bạn · tank đang xuất chiến</div>
            <label>Bot đồng đội <select class="flash-select" id="allyCount" aria-label="Số bot đồng đội"></select></label>
            <div id="allies"></div>
          </section>
          <section class="team enemy">
            <h2>Đội đối thủ</h2>
            <label>Bot địch <select class="flash-select" id="enemyCount" aria-label="Số bot địch"></select></label>
            <div id="enemies"></div>
          </section>
        </div>

        <label class="hint-toggle" title="Thanh máu địch sáng đỏ khi Quan Vũ có thể dùng Space trảm ngay (≤ 30% HP)">
          <span>Gợi ý trảm Quan Vũ</span>
          <input class="flash-checkbox" id="quanvuHint" type="checkbox">
        </label>
        <p id="pool"></p>

        <div class="bots-actions">
          <button id="save" class="flash-sprite-btn save" disabled>Lưu thiết lập</button>
        </div>
        <p id="status" class="flash-notice" role="status">Đang tải thiết lập…</p>
      </form>
    </section>
  </main>

  <script>
  (function(){
    var $=function(id){return document.getElementById(id);},levels={allies:[],enemies:[]};
    function options(node,min,max){for(var n=min;n<=max;n++){var o=document.createElement('option');o.value=n;o.textContent=n;node.appendChild(o);}}
    options($('allyCount'),0,4);options($('enemyCount'),1,5);
    function render(key,count){var root=$(key);root.textContent='';for(var i=0;i<count;i++){var row=document.createElement('label'),select=document.createElement('select');select.className='flash-select';row.textContent='Bot '+(i+1)+' · cấp';select.setAttribute('aria-label',row.textContent+' '+(key==='allies'?'đồng đội':'địch'));options(select,1,6);select.value=levels[key][i]||5;row.appendChild(select);root.appendChild(row);}}
    function read(key){return Array.prototype.map.call($(key).querySelectorAll('select'),function(s){return Number(s.value);});}
    function change(key,id){levels[key]=read(key);render(key,Number($(id).value));}
    $('allyCount').onchange=function(){change('allies','allyCount');};$('enemyCount').onchange=function(){change('enemies','enemyCount');};
    $('mode').onchange=function(){var fixed=this.value==='test_desert';$('teams').style.display=fixed||this.value==='test'?'none':'';$('testDesert').hidden=!fixed;$('pool').hidden=fixed;};
    function request(url,data){return fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})}).then(function(r){return r.text().then(function(t){var v=null;try{v=t?JSON.parse(t):{};}catch(_){v=null;}if(!r.ok||!v||!v.success)throw Error((v&&v.message)||('HTTP '+r.status+': không thực hiện được.'));return v;});});}
    request('/api/bots/get').then(function(v){levels=v.setup;$('quanvuHint').checked=v.setup.quanvu_execute_hint===true;$('mode').value=v.setup.mode;$('mode').onchange();$('allyCount').value=levels.allies.length;$('enemyCount').value=levels.enemies.length;render('allies',levels.allies.length);render('enemies',levels.enemies.length);$('pool').textContent='Tank AI: '+v.tanks.join(', ');$('status').className='flash-notice';$('status').textContent='Áp dụng từ trận mới.';$('save').disabled=false;}).catch(function(e){$('status').className='flash-notice is-error';$('status').textContent=e.message;});
    $('setup').onsubmit=function(e){e.preventDefault();$('save').disabled=true;request('/api/bots/save',{mode:$('mode').value,allies:read('allies'),enemies:read('enemies'),quanvu_execute_hint:$('quanvuHint').checked}).then(function(){$('status').className='flash-notice';$('status').textContent='Đã lưu. Tạo hoặc vào phòng mới để áp dụng.';}).catch(function(e){$('status').className='flash-notice is-error';$('status').textContent=e.message;}).then(function(){$('save').disabled=false;});};
  })();
  </script>
</body>
</html>
