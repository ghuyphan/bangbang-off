<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bang Bang Private</title>
  <link rel="stylesheet" href="/flash-ui.css?v=flash-native-2">
  <style>
    html,body{width:100%;height:100%;min-width:320px;min-height:500px;margin:0;overflow:hidden}
    .entry-shell{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow-y:auto}
    .entry-logo{width:min(310px,78vw)}
    .entry-card{width:min(390px,100%)}
    .screen[hidden]{display:none!important}
    .field-label{display:block;margin:10px 0 5px;color:#fff4c2;font:700 12.5px Tahoma,Arial,sans-serif;text-shadow:var(--bb-shadow)}
    .field-label:first-child{margin-top:0}
    .entry-card input[type="text"],.entry-card input[type="password"]{width:100%;height:38px}
    .password-row{position:relative}
    .password-row input{padding-right:64px}
    .toggle-password{position:absolute;top:4px;right:4px;min-height:30px;height:30px;padding:0 10px;font-size:11.5px}
    .form-meta{display:flex;align-items:center;justify-content:space-between;margin-top:11px;color:var(--bb-ice);font-size:12px}
    .remember{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:700}
    .primary-actions{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:16px}
    .sub-links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
    .sub-links .flash-btn{min-height:30px;padding:4px 12px;font-size:12px}
    .message{min-height:16px;margin:10px 0 0;color:#ffd2c4;font:700 12px/1.35 Tahoma,Arial,sans-serif;text-align:center}
    .message.success{color:#bfffd3}
    .welcome-card{text-align:center}
    .welcome-account{display:inline-block;margin:4px auto 6px;padding:6px 16px;border-radius:6px;background:#042944;border:1.5px solid #7cd7fb;color:#ffe66d;font:700 15px Tahoma,Arial,sans-serif}
    #gameShell{position:relative;display:none;width:100%;height:100%;background:#000}
    #game{width:100%;height:calc(100% - 36px);background:#000}
    .game-toolbar{height:36px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,#0f6ea3 0%,#05375c 100%);border-bottom:2px solid #85dcff}
    .toolbar-brand{display:flex;align-items:center;gap:8px;color:#fff4c2;font:700 12.5px Tahoma,Arial,sans-serif}
    .toolbar-brand img{height:21px;width:auto}
    .toolbar-links{display:flex;align-items:center;gap:8px}
    .toolbar-links .flash-btn{min-height:26px;height:26px;padding:2px 10px;font-size:11.5px}
  </style>
</head>
<body class="flash-page">
  <main id="entry" class="entry-shell">
    <img class="flash-logo entry-logo" src="/rez/zh_CN/gui_summer/controls/login/90fc008dc8684aadd6f2736ca5d650e8.png" alt="BANG BANG">

    <form class="flash-window entry-card screen" id="loginForm" novalidate>
      <h1 class="flash-window-head">ĐĂNG NHẬP · FLASH</h1>
      <div class="flash-window-body">
        <label class="field-label" for="username">Tài khoản</label>
        <input class="flash-input" id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" required autofocus placeholder="Nhập tài khoản">
        <label class="field-label" for="password">Mật khẩu</label>
        <div class="password-row">
          <input class="flash-input" id="password" name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Nhập mật khẩu">
          <button id="togglePassword" class="flash-btn is-quiet toggle-password" type="button">Hiện</button>
        </div>
        <div class="form-meta">
          <label class="remember" for="rememberMe"><input class="flash-checkbox" id="rememberMe" type="checkbox"> Ghi nhớ tài khoản</label>
          <span>Server local</span>
        </div>
        <div class="primary-actions">
          <button id="submitButton" class="flash-sprite-btn" type="submit">Đăng nhập</button>
        </div>
        <div class="sub-links">
          <a class="flash-btn is-quiet" href="/html5/">Mở bản HTML5 ↗</a>
        </div>
        <p id="loginError" class="message" role="alert"></p>
      </div>
    </form>

    <section class="flash-window entry-card screen welcome-card" id="welcomeScreen" hidden>
      <h1 class="flash-window-head">CHÀO MỪNG BBER</h1>
      <div class="flash-window-body">
        <p id="welcomeAccount" class="welcome-account"></p>
        <div class="primary-actions">
          <button id="enterGameButton" class="flash-sprite-btn" type="button">Vào game</button>
          <button id="logoutButton" class="flash-sprite-btn is-red" type="button">Đăng xuất</button>
        </div>
        <div class="sub-links">
          <a class="flash-btn is-quiet" href="/bots.html" target="_blank" rel="noopener">Thiết lập bot ↗</a>
          <a class="flash-btn is-green" href="/html5/">Bản HTML5 ↗</a>
        </div>
        <p id="welcomeError" class="message"></p>
      </div>
    </section>
  </main>

  <section id="gameShell">
    <nav class="game-toolbar">
      <div class="toolbar-brand">
        <img src="/rez/zh_CN/gui_summer/controls/login/90fc008dc8684aadd6f2736ca5d650e8.png" alt="">
        <span>Bang Bang · Flash</span>
      </div>
      <div class="toolbar-links">
        <a class="flash-btn is-quiet" href="/bots.html" target="_blank" rel="noopener">Thiết lập bot ↗</a>
        <a class="flash-btn is-orange" href="/html5/">Bản HTML5 ↗</a>
      </div>
    </nav>
    <div id="game"></div>
  </section>

  <script>
    (function () {
      var loginForm = document.getElementById('loginForm');
      var welcomeScreen = document.getElementById('welcomeScreen');
      var usernameInput = document.getElementById('username');
      var passwordInput = document.getElementById('password');
      var rememberMe = document.getElementById('rememberMe');
      var submitButton = document.getElementById('submitButton');
      var loginError = document.getElementById('loginError');
      var welcomeAccount = document.getElementById('welcomeAccount');
      var welcomeError = document.getElementById('welcomeError');
      var gameShell = document.getElementById('gameShell');
      var entry = document.getElementById('entry');
      var pending = null;

      function trim(v) { return String(v || '').replace(/^\s+|\s+$/g, ''); }
      function enc(v) { return encodeURIComponent(String(v)); }
      function origin() { return location.protocol + '//' + location.host + '/'; }
      function message(node, value, ok) { node.textContent = value || ''; node.className = 'message' + (ok ? ' success' : ''); }
      function show(screen) { loginForm.hidden = screen !== loginForm; welcomeScreen.hidden = screen !== welcomeScreen; }
      function post(url, payload) {
        return fetch(url, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload||{})})
          .then(function (r) { if (!r.ok) throw new Error('Máy chủ đang bận.'); return r.json(); });
      }
      function accept(result) {
        if (!result || !result.success || !result.loginToken) throw new Error('Phiên đăng nhập không hợp lệ.');
        var user = result.username || trim(usernameInput.value);
        if (rememberMe.checked) localStorage.setItem('bangbang.username', user);
        pending = {username:user, loginToken:String(result.loginToken)};
        passwordInput.value = '';
        welcomeAccount.textContent = user;
        message(welcomeError, '', false);
        show(welcomeScreen);
      }
      function mountGame() {
        if (!pending) { show(loginForm); return; }
        var vars = 'userId=' + enc(pending.username)
          + '&accessToken=' + enc(pending.loginToken)
          + '&sid=299001&cm=1&ch=website&bblaunch=1'
          + '&rezbase=' + enc(origin())
          + '&version=CRYSTALS-20261014'
          + '&resConfigMd5=resConfigShop20261013.cub'
          + '&offlineBuild=PVP-SHOP-FRAGMENTS-R197-20260909'
          + '&cacheBust=' + Date.now();
        var movie = 'TankLoaderR150.swf?cacheBust=' + Date.now();
        var gameEl = document.getElementById('game');
        var obj = document.createElement('object');
        obj.id = 'bangbang';
        obj.type = 'application/x-shockwave-flash';
        obj.data = movie;
        obj.width = '100%';
        obj.height = '100%';
        [['movie', movie], ['FlashVars', vars], ['allowScriptAccess', 'sameDomain'],
          ['allowFullScreen', 'true'], ['wmode', 'direct']].forEach(function (pair) {
          var param = document.createElement('param');
          param.name = pair[0];
          param.value = pair[1];
          obj.appendChild(param);
        });
        var embed = document.createElement('embed');
        embed.src = movie;
        embed.setAttribute('FlashVars', vars);
        embed.width = '100%';
        embed.height = '100%';
        embed.type = 'application/x-shockwave-flash';
        embed.setAttribute('allowFullScreen', 'true');
        embed.setAttribute('wmode', 'direct');
        obj.appendChild(embed);
        gameEl.replaceChildren(obj);
        pending = null;
        entry.style.display = 'none';
        gameShell.style.display = 'block';
      }

      usernameInput.value = localStorage.getItem('bangbang.username') || '';
      rememberMe.checked = Boolean(usernameInput.value);
      document.getElementById('togglePassword').onclick = function () {
        var showPw = passwordInput.type === 'password';
        passwordInput.type = showPw ? 'text' : 'password';
        this.textContent = showPw ? 'Ẩn' : 'Hiện';
      };
      loginForm.onsubmit = function (ev) {
        ev.preventDefault();
        var user = trim(usernameInput.value), pw = passwordInput.value;
        message(loginError, '', false);
        if (user.length < 3 || user.length > 32) { message(loginError, 'Tài khoản 3–32 ký tự.'); return false; }
        if (pw.length < 6) { message(loginError, 'Mật khẩu tối thiểu 6 ký tự.'); return false; }
        submitButton.disabled = true; submitButton.textContent = 'Đang kiểm tra…';
        post('/api/login', {username:user, password:pw}).then(function (r) {
          if (!r.success) throw new Error(r.message || 'Sai tài khoản hoặc mật khẩu.');
          if (!rememberMe.checked) localStorage.removeItem('bangbang.username');
          accept(r);
        }).catch(function (e) {
          message(loginError, e.message || 'Không thể kết nối máy chủ.', false);
        }).then(function () {
          submitButton.disabled = false; submitButton.textContent = 'Đăng nhập';
        });
        return false;
      };
      document.getElementById('logoutButton').onclick = function () {
        pending = null;
        post('/api/logout', {}).catch(function () {});
        document.getElementById('game').innerHTML = '';
        gameShell.style.display = 'none';
        entry.style.display = 'flex';
        show(loginForm);
      };
      document.getElementById('enterGameButton').onclick = function () {
        var btn = this;
        if (!pending) { show(loginForm); return; }
        btn.disabled = true; btn.textContent = 'Đang vào game…';
        post('/api/session', {}).then(function (r) {
          if (!r.success || !r.loginToken) throw new Error('Phiên hết hạn.');
          pending = {username: r.username || pending.username, loginToken: String(r.loginToken)};
          mountGame();
        }).catch(function (e) {
          message(welcomeError, e.message || 'Không thể xác thực.', false);
        }).then(function () {
          btn.disabled = false; btn.textContent = 'Vào game';
        });
      };
      post('/api/session', {}).then(function (r) { if (r.success && r.loginToken) accept(r); }).catch(function () {});
    }());
  </script>
</body>
</html>
